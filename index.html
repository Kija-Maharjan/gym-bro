<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calisthenics Bros — Training Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0b;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #272727;
  --border2: #363636;
  --text: #f0ede6;
  --muted: #777;
  --hint: #3a3a3a;
  --accent: #e8533a;
  --accent2: #f4c97a;
  --a-col: #b39ddb;
  --a-bg: rgba(61,46,110,0.18);
  --a-border: rgba(179,157,219,0.3);
  --b-col: #80cbc4;
  --b-bg: rgba(13,59,53,0.18);
  --b-border: rgba(128,203,196,0.3);
  --done: #81c784;
  --done-bg: rgba(30,80,30,0.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}

/* ── SETUP BANNER ── */
#setupBanner{
  background:linear-gradient(135deg,rgba(232,83,58,.15),rgba(244,201,122,.1));
  border-bottom:1px solid rgba(232,83,58,.3);
  padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
#setupBanner span{font-size:13px;color:#f0ede6}
.setup-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;width:100%}
.setup-fields input{
  flex:1;min-width:220px;background:rgba(255,255,255,.06);border:1px solid var(--border2);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  padding:7px 12px;border-radius:8px;outline:none;
}
.btn-connect{
  padding:8px 18px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap;
}
#connStatus{font-family:'Space Mono',monospace;font-size:11px;padding:4px 10px;border-radius:6px;white-space:nowrap}
#connStatus.ok{background:rgba(129,199,132,.15);color:var(--done);border:1px solid rgba(129,199,132,.3)}
#connStatus.err{background:rgba(232,83,58,.15);color:var(--accent);border:1px solid rgba(232,83,58,.3)}

/* ── HERO ── */
.hero{padding:64px 24px 48px;text-align:center;position:relative;overflow:hidden}
.hero-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,10vw,110px);line-height:.9;letter-spacing:.02em;margin-bottom:14px;}
.hero-title span{color:var(--accent)}
.athletes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
.ab{padding:14px 18px;border-radius:12px;border:1px solid;text-align:left;min-width:165px}
.ab.a{border-color:var(--a-col);background:var(--a-bg)}
.ab.b{border-color:var(--b-col);background:var(--b-bg)}
.ab-tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:5px}
.ab-name{font-size:16px;font-weight:600;margin-bottom:2px}
.ab-stats{font-size:11px;color:var(--muted);line-height:1.9}

/* ── TRACKER STYLES ── */
.main-wrap{max-width:900px;margin:0 auto;padding:0 20px 60px}
.week-tabs{display:flex;gap:7px;flex-wrap:wrap}
.wtab{padding:7px 14px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;}
.wtab.active{background:var(--accent);color:#fff}

.prog-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:22px}
.ps{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.ps.complete{border-color:var(--done)}

.day-list{display:flex;flex-direction:column;gap:12px}
.day-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.day-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;}
.day-body{display:none;background:var(--bg);padding-bottom:20px}
.day-card.open .day-body{display:block}

.ex-row{display:grid;grid-template-columns:26px 1fr 110px 110px;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border)}
.pill{display:inline-block;padding:4px 9px;border-radius:100px;font-size:10px;font-weight:500;border:1px solid}
.pill-a{background:var(--a-bg);color:var(--a-col);border-color:var(--a-border)}
.pill-b{background:var(--b-bg);color:var(--b-col);border-color:var(--b-border)}
.pill-s{background:rgba(244,201,122,.1);color:var(--accent2);border-color:rgba(244,201,122,.3)}

.comment-list{padding:18px;display:flex;flex-direction:column;gap:8px}
.comment-item{padding:10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.cm-input{width:100%;background:var(--surface);border:1px solid var(--border2);color:#fff;padding:10px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<div id="setupBanner">
  <div style="width:100%">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-weight:600">🔌 Database Connection</span>
      <div id="connStatus" class="err">● Not connected</div>
    </div>
    <div class="setup-fields">
      <input id="sbUrl" type="text" placeholder="Supabase URL" />
      <input id="sbKey" type="text" placeholder="Anon public key" />
      <button class="btn-connect" onclick="connectSupabase()">Connect</button>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-tag">Beginner to Beast · 2026</div>
  <h1 class="hero-title">CALIS<span>THEN</span>ICS<br>BROS</h1>
  <div class="athletes">
    <div class="ab a">
      <div class="ab-tag">Athlete A · 71 kg</div>
      <div class="ab-name">The Beginner</div>
      <div class="ab-stats">Focus: Form & Foundations<br>Goal: 10 clean pull-ups</div>
    </div>
    <div class="ab b">
      <div class="ab-tag">Athlete B · 100 kg</div>
      <div class="ab-name">The Powerlifter</div>
      <div class="ab-stats">Focus: Joint Prep & Volume<br>Goal: Master Body Control</div>
    </div>
  </div>
</div>

<div class="main-wrap">
  <div class="week-tabs" id="weekTabs" style="margin-bottom:20px"></div>
  <div class="prog-strip" id="progStrip"></div>
  <div class="day-list" id="dayList"></div>
</div>

<script>
// Revised doable exercises
const DAYS = [
  { id:'mon', weekday:'Monday', type:'Push Day', name:'Push Foundations', focus:'Chest & Shoulders', tip:'100kg: Focus on a 3-second descent on every push-up.',
    exercises:[
      {name:'Warm-up', note:'Arm circles + 10 Wall Push-ups', type:'s', a:'Same', b:'Same'},
      {name:'Incline Push-ups', note:'Chest-to-bar focus', type:'ab', a:'3x10', b:'3x15 (Standard)'},
      {name:'Pike Hold', note:'Shoulder stability', type:'ab', a:'3x20s', b:'3x30s'},
      {name:'Bench Dips', note:'Tricep focus', type:'ab', a:'3x8', b:'3x12'},
    ]
  },
  { id:'tue', weekday:'Tuesday', type:'Pull Day', name:'Pull Foundations', focus:'Back & Grip', tip:'Dead hangs are key for grip strength at 100kg.',
    exercises:[
      {name:'Scapular Pulls', note:'Engage the back first', type:'s', a:'3x8', b:'3x10'},
      {name:'Dead Hangs', note:'Grip strength', type:'s', a:'3x20s', b:'3x30s'},
      {name:'Australian Rows', note:'Bar at chest height', type:'ab', a:'3x8', b:'3x12 (Lower bar)'},
      {name:'Bicep Chin-up Negatives', note:'Jump up, slowly lower', type:'ab', a:'3x3', b:'3x5'},
    ]
  },
  { id:'wed', weekday:'Wednesday', type:'Core/Skill', name:'Core Basics', focus:'Abs & Balance', tip:'Keep lower back pressed into the floor.',
    exercises:[
      {name:'Plank', note:'Max tension', type:'s', a:'3x30s', b:'3x45s'},
      {name:'Knee Tucks', note:'On floor or bar', type:'ab', a:'3x10', b:'3x12'},
      {name:'Bird-Dogs', note:'Stability focus', type:'s', a:'3x10', b:'3x10'},
    ]
  },
  { id:'thu', weekday:'Thursday', type:'Leg Day', name:'Leg Foundations', focus:'Quads & Glutes', tip:'Powerlifter: Use your mobility advantage here.',
    exercises:[
      {name:'Bodyweight Squats', note:'Full depth', type:'ab', a:'3x12', b:'3x20'},
      {name:'Assisted Split Squats', note:'Balance help if needed', type:'ab', a:'3x8 each', b:'3x10 each'},
      {name:'Calf Raises', note:'Slow and controlled', type:'s', a:'3x15', b:'3x15'},
    ]
  },
  { id:'fri', weekday:'Friday', type:'Full Body', name:'The Finisher', focus:'Total Body', tip:'End the week strong.',
    exercises:[
      {name:'Push-up to Plank hold', note:'Hybrid move', type:'ab', a:'3x5 reps', b:'3x8 reps'},
      {name:'Row to Hang hold', note:'Hybrid move', type:'ab', a:'3x5 reps', b:'3x8 reps'},
      {name:'Air Squat AMRAP', note:'As many as possible in 1 min', type:'s', a:'1 min', b:'1 min'},
    ]
  },
  { id:'sat', weekday:'Saturday', type:'Rest', name:'Active Recovery', focus:'Walking', tip:'Go for a 30 min walk.', exercises:[]},
  { id:'sun', weekday:'Sunday', type:'Rest', name:'Full Rest', focus:'Recovery', tip:'Sleep well.', exercises:[]},
];

let currentWeek = 1;
let sbClient = null;
let isOnline = false;
const openCards = new Set();

async function initSupabase(url, key){
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sbClient = createClient(url, key);
    const { error } = await sbClient.from('comments').select('id').limit(1);
    if(error && error.code !== 'PGRST116') throw error;
    isOnline = true;
    document.getElementById('connStatus').className = 'ok';
    document.getElementById('connStatus').textContent = '● Connected';
    renderAll();
  } catch(e) {
    console.error(e);
    document.getElementById('connStatus').textContent = '● Connection Error (Check RLS)';
  }
}

function connectSupabase(){
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if(!url || !key) return;
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  initSupabase(url, key);
}

// Fixed for SQL Schema
async function dbAddComment(w, dayId, athlete, exName, body){
  const newC = {
    week: w, 
    day_id: dayId, 
    athlete: athlete, 
    ex_name: exName, 
    content: body // Matches SQL 'content' column
  };

  if(isOnline && sbClient) {
    const { data, error } = await sbClient.from('comments').insert([newC]).select().single();
    if(error) console.error("Upload failed (Check RLS policies)", error);
    return data;
  }
  return newC;
}

async function renderDays(){
  const el = document.getElementById('dayList');
  el.innerHTML = '';

  for (const day of DAYS) {
    const isOpen = openCards.has(day.id);
    const card = document.createElement('div');
    card.className = `day-card ${isOpen ? 'open' : ''}`;
    
    let exHtml = day.exercises.map(ex => `
      <div class="ex-row">
        <div style="font-weight:bold">✓</div>
        <div>${ex.name}</div>
        <div><span class="pill pill-a">${ex.a}</span></div>
        <div><span class="pill pill-b">${ex.b}</span></div>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="day-hd" onclick="toggleDay('${day.id}')">
        <div><strong>${day.weekday}</strong>: ${day.name}</div>
      </div>
      <div class="day-body">
        ${exHtml}
        <div class="comment-list" id="cmts_${day.id}"></div>
        <div style="padding:18px">
          <select id="sel_${day.id}"><option value="A">71kg</option><option value="B">100kg</option></select>
          <input type="text" id="inp_${day.id}" class="cm-input" placeholder="Add a comment...">
          <button onclick="postC('${day.id}')" style="margin-top:10px; padding:5px 15px">Post</button>
        </div>
      </div>
    `;
    el.appendChild(card);
    if(isOnline) loadComments(day.id);
  }
}

async function loadComments(dayId){
  const { data } = await sbClient.from('comments').select('*').eq('week', currentWeek).eq('day_id', dayId);
  if(data) {
    const list = document.getElementById('cmts_'+dayId);
    list.innerHTML = data.map(c => `<div class="comment-item"><strong>${c.athlete}</strong>: ${c.content}</div>`).join('');
  }
}

async function postC(dayId){
  const athlete = document.getElementById('sel_'+dayId).value;
  const content = document.getElementById('inp_'+dayId).value;
  await dbAddComment(currentWeek, dayId, athlete, 'General', content);
  loadComments(dayId);
  document.getElementById('inp_'+dayId).value = '';
}

function toggleDay(id){
  if(openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  renderDays();
}

function renderWeekTabs(){
  const el = document.getElementById('weekTabs');
  el.innerHTML = [1,2,3,4].map(w => `<button class="wtab ${w===currentWeek?'active':''}" onclick="currentWeek=${w};renderAll()">${w}</button>`).join('');
}

function renderAll(){
  renderWeekTabs();
  renderDays();
}

renderAll();
</script>
</body>
</html>
